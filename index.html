<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flores Amarillas 🌼</title>
<meta property="og:title" content="Tengo un regalo para vos 🌼">
<meta property="og:description" content="Abrilo 💛">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --amarillo:#ffd21f; --amarillo2:#ffab00; --verde:#3f9b3a; --verde2:#2a6f28; --violeta:#7b61ff; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; }
  body {
    font-family: 'Quicksand', system-ui, sans-serif;
    background: linear-gradient(180deg, #8fd3f4 0%, #d4f1ff 55%, #fff7d6 100%);
    color:#4a3500;
  }
  .sol { position:fixed; top:-60px; right:-60px; width:200px; height:200px; border-radius:50%;
    background:radial-gradient(circle, #fff6b0 0%, #ffe45c 45%, rgba(255,228,92,0) 70%);
    animation:latir 4s ease-in-out infinite; }
  @keyframes latir { 50% { transform:scale(1.12); } }
  .pasto { position:fixed; bottom:0; left:0; right:0; height:9vh;
    background:linear-gradient(180deg, #7cc95a, #4f9e3a); border-radius:50% 50% 0 0 / 26px 26px 0 0; }

  /* ---------- Pantalla inicial ---------- */
  .inicio { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:26px; padding:0 16px; text-align:center;
    transition:opacity .6s, transform .6s; }
  .inicio.oculto { opacity:0; transform:scale(.8); pointer-events:none; }
  .inicio h1 { font-size:clamp(1.9rem, 7vw, 3rem); font-family:'Dancing Script', cursive; font-weight:700; }
  .regalo { font-size:4rem; animation:saltar 1.4s ease-in-out infinite; }
  @keyframes saltar { 0%,100%{transform:translateY(0) rotate(0)} 30%{transform:translateY(-14px) rotate(-6deg)} 60%{transform:translateY(0) rotate(5deg)} }
  button {
    font-family:inherit; font-size:clamp(1.05rem, 4.5vw, 1.3rem); font-weight:700;
    padding:16px 30px; border:none; border-radius:999px; cursor:pointer; color:#4a3500;
    background:linear-gradient(135deg, var(--amarillo), var(--amarillo2));
    box-shadow:0 6px 0 #c98400, 0 10px 25px rgba(255,171,0,.45);
  }
  button:active { transform:translateY(4px); box-shadow:0 2px 0 #c98400; }
  button small { display:block; font-size:.65em; font-weight:500; opacity:.85; margin-top:2px; }

  /* ---------- Escena ---------- */
  .frase { position:fixed; top:0; left:0; right:0; z-index:8; text-align:center; padding:4vh 18px 0;
    opacity:0; transform:translateY(-15px); transition:opacity 1.2s, transform 1.2s; pointer-events:none; }
  .frase.ver { opacity:1; transform:none; }
  .frase h2 { font-size:clamp(1.5rem, 6.5vw, 2.5rem); font-family:'Dancing Script', cursive; font-weight:700;
    color:#5a3f00; text-shadow:0 2px 12px rgba(255,255,255,.95); line-height:1.3; }
  .frase p { margin-top:10px; font-size:clamp(1.6rem, 7.5vw, 2.6rem); font-family:'Quicksand', system-ui, sans-serif;
    font-weight:500; color:#5a3f00; letter-spacing:.3px; }
  .botones { position:fixed; left:50%; bottom:14vh; transform:translateX(-50%); z-index:7;
    display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
    opacity:0; transition:opacity 1.2s, transform 1.2s; pointer-events:none; }
  .botones.ver { opacity:1; transform:translateX(-50%); }
  .otra { pointer-events:auto; font-size:.9rem; padding:9px 18px; }
  .cancion { color:#fff; background:linear-gradient(135deg, #ffa040, #ff7a00);
    box-shadow:0 5px 0 #c25b00, 0 8px 20px rgba(255,122,0,.4); animation:pulso 1.8s ease-in-out infinite; }
  .cancion:active { box-shadow:0 2px 0 #c25b00; }
  @keyframes pulso { 50% { transform:scale(1.06); } }

  /* ventana del video */
  .hoja-video { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    padding:16px; background:rgba(40,25,70,.45); opacity:0; pointer-events:none; transition:opacity .4s; }
  .hoja-video.abierta { opacity:1; pointer-events:auto; }
  .tarjeta { width:min(100%, 560px); background:#f6f0ff; border-radius:20px; overflow:hidden;
    box-shadow:0 20px 50px rgba(60,30,120,.4); transform:translateY(40px) scale(.95); transition:transform .4s; }
  .hoja-video.abierta .tarjeta { transform:none; }
  .cabecera { display:flex; align-items:center; justify-content:flex-end; padding:10px 12px;
    font-style:italic; font-weight:700; color:#5540d1; }
  .cerrar { padding:6px 12px; font-size:1rem; color:#fff; background:#7b61ff; box-shadow:none; border-radius:999px; }
  .video { position:relative; aspect-ratio:16 / 9; background:#000; }
  .video iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }

  .firma { position:fixed; left:0; right:0; bottom:0; z-index:9; text-align:center;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, rgba(79,158,58,0), rgba(46,110,34,.85) 45%);
    color:#fffbe6; opacity:0; transition:opacity 1.2s .6s; pointer-events:none; }
  .firma.ver { opacity:1; }
  .firma p { font-size:clamp(.9rem, 3.7vw, 1.1rem); font-weight:500; text-shadow:0 1px 4px rgba(0,0,0,.35); }
  .firma span { display:block; margin-top:3px; font-family:'Quicksand', system-ui, sans-serif; font-size:.8rem;
    letter-spacing:1px; font-weight:700; color:#f8e48d; }

  .ramo { --H:min(58vh, 580px); position:fixed; left:50%; bottom:8vh; z-index:5;
    width:min(96vw, 470px); height:var(--H); transform:translateX(-50%); display:none; }
  .ramo.ver { display:block; }

  .papel-atras, .papel-frente, .mono { position:absolute; left:50%; transform:translateX(-50%); }
  .papel-atras { bottom:18%; width:92%; height:58%; z-index:0; opacity:0; animation:aparecer .8s ease-out forwards; }
  .papel-frente { bottom:0; width:66%; height:42%; z-index:50; opacity:0;
    animation:subir .8s ease-out forwards; }
  .mono { bottom:17%; width:34%; z-index:51; opacity:0; animation:aparecer .6s ease-out .6s forwards; }
  @keyframes aparecer { to{opacity:1} }
  @keyframes subir { from{opacity:0; transform:translate(-50%, 30px)} to{opacity:1; transform:translate(-50%, 0)} }

  /* cada flor sale del punto donde se ata el ramo */
  .flor { position:absolute; left:50%; bottom:20%; width:0; height:var(--h);
    transform:rotate(var(--a)); transform-origin:bottom center; }
  .mece { position:absolute; inset:0; transform-origin:bottom center;
    animation:mecer var(--m) ease-in-out infinite alternate; animation-delay:calc(var(--d) + 2s); }
  @keyframes mecer { from{transform:rotate(-2.5deg)} to{transform:rotate(2.5deg)} }

  .tallo { position:absolute; bottom:0; left:-2.5px; width:5px; height:100%; border-radius:3px;
    background:linear-gradient(90deg, #52b04a, var(--verde2));
    transform:scaleY(0); transform-origin:bottom; animation:crecer 1.3s ease-out forwards; animation-delay:var(--d); }
  @keyframes crecer { to{transform:scaleY(1)} }
  .hoja { position:absolute; width:calc(var(--H) * .075); height:calc(var(--H) * .03);
    background:linear-gradient(135deg, #6cc55f, var(--verde2)); border-radius:0 100% 0 100%; }
  .hoja.i { right:3px; top:var(--y); transform:rotate(-30deg); transform-origin:right center; }
  .hoja.d { left:3px; top:var(--y); transform:rotate(30deg) scaleX(-1); transform-origin:left center; }

  .cabeza { --S:calc(var(--H) * .2 * var(--s)); position:absolute; top:0; left:0;
    width:var(--S); height:var(--S); margin:calc(var(--S) / -2) 0 0 calc(var(--S) / -2);
    transform:scale(0) rotate(-120deg); animation:abrir 1.2s cubic-bezier(.3,1.5,.5,1) forwards;
    animation-delay:calc(var(--d) + 1s); filter:drop-shadow(0 3px 4px rgba(120,70,0,.3)); }
  .cabeza svg { width:100%; height:100%; display:block; transform:rotate(var(--g)); }
  @keyframes abrir { to{transform:scale(1) rotate(0)} }

  /* pétalos que caen */
  .cae { position:fixed; top:-20px; width:12px; height:16px; border-radius:50% 50% 45% 45% / 70% 70% 30% 30%;
    background:radial-gradient(ellipse at 50% 30%, #fff08a, var(--amarillo) 55%, var(--amarillo2));
    z-index:3; pointer-events:none; animation:caer var(--t) linear forwards; }
  @keyframes caer { to { transform:translate(var(--dx), 110vh) rotate(720deg); opacity:.5; } }

  /* ---------- Mariposas (encima del ramo z:5, debajo de botones z:7, frase z:8 y firma z:9) ---------- */
  #mariposas { position:fixed; inset:0; z-index:6; pointer-events:none; overflow:hidden; }
  .mariposa { position:absolute; left:0; top:0; width:var(--w); height:calc(var(--w) * .8);
    pointer-events:none; will-change:transform; visibility:hidden; }
  .mariposa svg { display:block; width:100%; height:100%; overflow:visible;
    animation:impulso var(--vel, .12s) ease-in-out infinite alternate; }
  .mariposa .ala-izq { transform-origin:0 0; transform-box:view-box;
    animation:aleteoIzq var(--vel, .12s) ease-in-out infinite alternate; }
  .mariposa .ala-der { transform-origin:0 0; transform-box:view-box;
    animation:aleteoDer var(--vel, .12s) ease-in-out infinite alternate; }
  .mariposa.quieta svg, .mariposa.quieta .ala-izq, .mariposa.quieta .ala-der { animation:none; }
  @keyframes aleteoIzq { from { transform:scaleX(1); } to { transform:scaleX(.15); } }
  @keyframes aleteoDer { from { transform:scaleX(1); } to { transform:scaleX(.15); } }
  @keyframes impulso { from { transform:translateY(2px); } to { transform:translateY(-2px); } }
  @media (prefers-reduced-motion: reduce) {
    .mariposa svg, .mariposa .ala-izq, .mariposa .ala-der { animation:none; }
  }
</style>
</head>
<body>
  <!-- Dibujos reutilizables -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <radialGradient id="gPetalo" cx="0" cy="0" r="48" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#ff9d00"/>
        <stop offset=".35" stop-color="#ffc400"/>
        <stop offset=".75" stop-color="#ffdd2e"/>
        <stop offset="1" stop-color="#ffe97a"/>
      </radialGradient>
      <radialGradient id="gPetaloAtras" cx="0" cy="0" r="50" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#e07800"/>
        <stop offset="1" stop-color="#f5b400"/>
      </radialGradient>
      <radialGradient id="gCentro" cx="-.3" cy="-.3" r="1.2">
        <stop offset="0" stop-color="#b86b1d"/>
        <stop offset=".6" stop-color="#6e3a0b"/>
        <stop offset="1" stop-color="#4a2504"/>
      </radialGradient>
      <path id="petalo" d="M0,0 C-8,-10 -10,-30 -2,-45 Q0,-48 2,-45 C10,-30 8,-10 0,0Z"/>
      <path id="petaloCorto" d="M0,0 C-6,-8 -7,-20 -1,-30 Q0,-32 1,-30 C7,-20 6,-8 0,0Z"/>
    </defs>
  </svg>

  <div class="sol"></div>
  <div class="pasto"></div>

  <section class="inicio" id="inicio">
    <div class="regalo">🎁</div>
    <button id="abrir">Tengo un regalo para vos 💕<small>(Hace Click)</small></button>
  </section>

  <div class="frase" id="frase">
    <h2>Para que en esta primavera<br>no seas espectadora<br>y tengas tus flores amarillas 🌼</h2>
    <p>✨ ¡¡Feliz Primavera!! ✨</p>
  </div>

  <div class="ramo" id="ramo"></div>

  <div class="botones" id="botones">
    <button class="otra cancion" id="cancion">🎶 Tu canción<small>(Hace Click)</small></button>
  </div>

  <div class="hoja-video" id="hojaVideo">
    <div class="tarjeta">
      <div class="cabecera">
        <button class="cerrar" id="cerrar" aria-label="Cerrar">✕</button>
      </div>
      <div class="video"><iframe id="yt" title="Flores amarillas" allow="autoplay; encrypted-media; picture-in-picture"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
    </div>
  </div>

  <footer class="firma" id="firma">
    
    <span>by: NkoCussi</span>
  </footer>

<script>
  const ramo = document.getElementById('ramo');
  const frase = document.getElementById('frase');
  let lluvia;

  // ---- dibujo de una flor (se genera una vez) ----
  function cabezaSVG() {
    let s = '<svg viewBox="-50 -50 100 100">';
    for (let i = 0; i < 18; i++) s += `<use href="#petalo" fill="url(#gPetaloAtras)" transform="rotate(${i*20+10}) scale(1.04)"/>`;
    for (let i = 0; i < 18; i++) s += `<use href="#petalo" fill="url(#gPetalo)" stroke="#e8a000" stroke-width=".4" transform="rotate(${i*20})"/>`;
    for (let i = 0; i < 18; i++) s += `<line x1="0" y1="-16" x2="0" y2="-38" stroke="#e39a00" stroke-width=".5" opacity=".6" transform="rotate(${i*20})"/>`;
    for (let i = 0; i < 14; i++) s += `<use href="#petaloCorto" fill="#ffb300" transform="rotate(${i*25.7+6})"/>`;
    s += '<circle r="15" fill="url(#gCentro)"/>';
    // semillas en espiral (como un girasol)
    const oro = 137.508 * Math.PI / 180;
    for (let i = 1; i < 90; i++) {
      const r = 1.45 * Math.sqrt(i), t = i * oro;
      if (r > 14) break;
      s += `<circle cx="${(r*Math.cos(t)).toFixed(2)}" cy="${(r*Math.sin(t)).toFixed(2)}" r="${(0.55 + r/40).toFixed(2)}" fill="${i%3 ? '#3a1d02' : '#d08a2a'}"/>`;
    }
    s += '<circle r="15" fill="none" stroke="#f0a000" stroke-width="1.2" opacity=".7"/>';
    return s + '</svg>';
  }
  const CABEZA = cabezaSVG();

  const PAPEL_ATRAS = `<svg class="papel-atras" viewBox="0 0 200 120" preserveAspectRatio="none">
    <defs><linearGradient id="gpa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#efe4ff"/><stop offset="1" stop-color="#cbb5f7"/></linearGradient></defs>
    <path d="M100,120 L2,22 Q30,6 55,16 Q78,0 100,10 Q122,0 145,16 Q170,6 198,22 Z" fill="url(#gpa)"/>
    <path d="M100,120 L55,16 M100,120 L145,16" stroke="#b79cf0" stroke-width=".8" fill="none"/></svg>`;

  const PAPEL_FRENTE = `<svg class="papel-frente" viewBox="0 0 200 200" preserveAspectRatio="none">
    <defs>
      <linearGradient id="gpf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b597f2"/><stop offset=".5" stop-color="#dccbff"/><stop offset="1" stop-color="#a888ee"/></linearGradient>
    </defs>
    <path d="M0,0 L50,22 L100,6 L150,22 L200,0 L122,200 L78,200 Z" fill="url(#gpf)"/>
    <path d="M0,0 L50,22 L92,200 L78,200 Z" fill="#9f7ee8" opacity=".55"/>
    <path d="M200,0 L150,22 L108,200 L122,200 Z" fill="#9f7ee8" opacity=".4"/>
    <path d="M100,6 L100,200" stroke="#f4edff" stroke-width="1.5" opacity=".7"/></svg>`;

  const MONO = `<svg class="mono" viewBox="0 0 120 80">
    <path d="M60,30 C40,5 8,8 14,28 C18,42 45,38 60,30Z" fill="#7b61ff"/>
    <path d="M60,30 C80,5 112,8 106,28 C102,42 75,38 60,30Z" fill="#6a4ff0"/>
    <path d="M56,34 L38,76 L48,70 L54,78 L60,36Z" fill="#6a4ff0"/>
    <path d="M64,34 L82,76 L72,70 L66,78 L60,36Z" fill="#5540d1"/>
    <path d="M25,24 C32,18 44,20 52,28" stroke="#a592ff" stroke-width="2" fill="none"/>
    <path d="M95,24 C88,18 76,20 68,28" stroke="#8a74ff" stroke-width="2" fill="none"/>
    <ellipse cx="60" cy="31" rx="9" ry="8" fill="#5a42e0"/></svg>`;

  // ---- composición del ramo ----
  // a: ángulo, h: alto (fracción del ramo), s: tamaño, d: retraso
  const flores = [
    // fila de atrás (tallos largos)
    { a:-10, h:.74, s:1.00, d:.6 }, { a:8,  h:.77, s:1.05, d:.7 },
    { a:-24, h:.66, s:.92, d:.8 },  { a:22, h:.67, s:.95, d:.9 },
    { a:0,   h:.62, s:.90, d:1.0 },
    // fila del medio
    { a:-36, h:.54, s:.88, d:1.1 }, { a:35, h:.55, s:.88, d:1.15 },
    { a:-15, h:.53, s:1.00, d:1.2 }, { a:14, h:.52, s:1.02, d:1.25 },
    // fila de adelante (tallos cortos)
    { a:-45, h:.42, s:.78, d:1.35 }, { a:44, h:.42, s:.80, d:1.4 },
    { a:-26, h:.41, s:.92, d:1.45 }, { a:25, h:.40, s:.92, d:1.5 },
    { a:-5,  h:.39, s:1.05, d:1.55 }
  ];

  function armarRamo() {
    let html = PAPEL_ATRAS;
    flores.forEach((f, i) => {
      const hojas = f.h > .5
        ? `<div class="hoja i" style="--y:${50 + (i%3)*6}%"></div><div class="hoja d" style="--y:${62 - (i%2)*8}%"></div>`
        : '';
      html += `<div class="flor" style="--a:${f.a}deg;--h:calc(var(--H) * ${f.h});z-index:${10+i}">
        <div class="mece" style="--d:${f.d}s;--m:${(2.4 + Math.random()*1.6).toFixed(2)}s">
          <div class="tallo" style="--d:${f.d}s">${hojas}</div>
          <div class="cabeza" style="--s:${f.s};--d:${f.d}s;--g:${Math.floor(Math.random()*360)}deg">${CABEZA}</div>
        </div></div>`;
    });
    html += PAPEL_FRENTE + MONO;
    ramo.innerHTML = html;
  }

  function petaloCae() {
    const p = document.createElement('div');
    p.className = 'cae';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.setProperty('--t', (5 + Math.random() * 4) + 's');
    p.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
    p.style.scale = (0.6 + Math.random() * 0.7).toFixed(2);
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 9500);
  }

  function mostrar() {
    document.getElementById('inicio').classList.add('oculto');
    const firma = document.getElementById('firma');
    const botones = document.getElementById('botones');
    frase.classList.remove('ver'); firma.classList.remove('ver'); botones.classList.remove('ver');
    ramo.classList.remove('ver'); void ramo.offsetWidth;
    armarRamo();
    ramo.classList.add('ver');
    setTimeout(() => { frase.classList.add('ver'); firma.classList.add('ver'); botones.classList.add('ver'); }, 3600);
    clearInterval(lluvia);
    lluvia = setInterval(petaloCae, 450);
  }

  // ---- canción (para cambiar el video, reemplazá solo este ID) ----
  const VIDEO_ID = 'hYO4eZqREvE';
  const hojaVideo = document.getElementById('hojaVideo');
  const yt = document.getElementById('yt');
  document.getElementById('cancion').onclick = () => {
    yt.src = `https://www.youtube.com/embed/${VIDEO_ID}?autoplay=1&rel=0&playsinline=1`;
    hojaVideo.classList.add('abierta');
  };
  function cerrarVideo() { hojaVideo.classList.remove('abierta'); setTimeout(() => yt.src = '', 400); }
  document.getElementById('cerrar').onclick = cerrarVideo;
  hojaVideo.onclick = e => { if (e.target === hojaVideo) cerrarVideo(); };

  document.getElementById('abrir').onclick = mostrar;
</script>

<script>
/* ---------- Mariposas animadas: SVG + CSS + un solo loop rAF ---------- */
(() => {
  const PALETAS = [
    { c1:'#fff3a0', c2:'#ffc400', borde:'#c98400' },   // dorada
    { c1:'#ffe0b8', c2:'#ff9a3c', borde:'#c96a14' },   // naranja suave
    { c1:'#efe4ff', c2:'#a888ee', borde:'#6a4ff0' },   // lila
    { c1:'#d7fbf6', c2:'#2ec4b6', borde:'#138a80' }    // turquesa
  ];
  const ANCHOS = [38, 32, 44, 35];
  const VEL_RAPIDO = .12, VEL_PLANEO = .35, VEL_POSADA = .4;
  const MARGEN = 20;
  const reducir = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const ramoEl = document.getElementById('ramo');
  const fraseEl = document.getElementById('frase');
  const botonesEl = document.getElementById('botones');
  const inicioEl = document.getElementById('inicio');

  let W = innerWidth, H = innerHeight;
  let ms = [], t = 0, last = null, raf = 0, proxPosarse = 0, ramoDesde = null, quietasListas = false;

  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---- dibujo ----
  function svgMariposa(p, id) {
    const ala = `
      <path d="M-1,-1 C-4,-20 -22,-38 -40,-34 C-52,-31 -48,-12 -30,-4 C-18,1 -8,2 -1,2Z" fill="url(#${id})" stroke="${p.borde}" stroke-width="1.1" stroke-linejoin="round"/>
      <path d="M-1,2 C-12,0 -32,4 -35,15 C-37,27 -21,32 -13,23 C-7,16 -4,10 -1,6Z" fill="url(#${id})" stroke="${p.borde}" stroke-width="1.1" stroke-linejoin="round"/>
      <circle cx="-40" cy="-27" r="1.9" fill="#fff" opacity=".85"/>
      <circle cx="-42" cy="-19" r="1.5" fill="#fff" opacity=".8"/>
      <circle cx="-36" cy="-12" r="1.2" fill="#fff" opacity=".75"/>
      <circle cx="-29" cy="20" r="1.6" fill="#fff" opacity=".8"/>
      <circle cx="-21" cy="23" r="1.3" fill="#fff" opacity=".75"/>`;
    return `<svg viewBox="-50 -40 100 80" aria-hidden="true">
      <defs><radialGradient id="${id}" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="50">
        <stop offset="0" stop-color="${p.c1}"/><stop offset="1" stop-color="${p.c2}"/></radialGradient></defs>
      <g class="ala-izq">${ala}</g>
      <g class="ala-der"><g transform="scale(-1 1)">${ala}</g></g>
      <path d="M-1,-13 C-3,-21 -8,-26 -13,-27 M1,-13 C3,-21 8,-26 13,-27" stroke="#3b2a1a" stroke-width=".9" fill="none" stroke-linecap="round"/>
      <circle cx="-13" cy="-27" r="1.2" fill="#3b2a1a"/><circle cx="13" cy="-27" r="1.2" fill="#3b2a1a"/>
      <ellipse cx="0" cy="2" rx="2.1" ry="12" fill="#3b2a1a"/>
      <circle cx="0" cy="-11" r="3.3" fill="#3b2a1a"/>
    </svg>`;
  }

  function crear(i) {
    const w = ANCHOS[i];
    const el = document.createElement('div');
    el.className = 'mariposa' + (reducir ? ' quieta' : '');
    el.style.cssText = `--w:${w}px;--vel:${VEL_RAPIDO}s`;
    el.innerHTML = svgMariposa(PALETAS[i], 'gmar' + i);
    document.getElementById('mariposas').appendChild(el);
    // entra desde un borde distinto cada una
    const bordes = [[-w, H * .45], [W + w, H * .3], [W * .3, -w], [W * .7, H + w]];
    return { el, svg: el.firstElementChild, w, h: w * .8, vel: VEL_RAPIDO,
      vmax: rnd(40, 90), amp: rnd(10, 18), frq: rnd(1.8, 3.6), ph: rnd(0, 6.28),
      x: bordes[i][0], y: bordes[i][1], vx: 0, vy: 0, tx: W / 2, ty: H / 2,
      hx: 1, hy: 0, tilt: 0, face: 1,
      estado: 'espera', inicio: i * .5, entrando: true,
      planeando: false, finPlaneo: 0, proxPlaneo: rnd(8, 15),
      flor: null, hasta: 0, quieta: false, proxQuieta: 0 };
  }

  // cambia la velocidad de aleteo sin saltos de fase
  function setVel(m, v) {
    if (m.vel === v) return;
    const anims = m.el.getAnimations({ subtree: true });
    const cts = anims.map(a => a.currentTime);
    const viejo = m.vel;
    m.vel = v;
    m.el.style.setProperty('--vel', v + 's');
    void m.el.offsetWidth;
    anims.forEach((a, i) => { if (cts[i] != null) a.currentTime = cts[i] * v / viejo; });
  }
  function setQuieta(m, q) {
    if (m.quieta === q) return;
    m.quieta = q;
    m.el.classList.toggle('quieta', q);
  }

  // ---- destinos ----
  function zonasTexto() {
    const zs = [];
    const enInicio = !inicioEl.classList.contains('oculto');
    const evitar = enInicio ? inicioEl.querySelectorAll('.regalo, button') : [fraseEl, botonesEl];
    for (const e of evitar) {
      const b = e.getBoundingClientRect();
      if (b.width && b.height) zs.push({ l: b.left - 10, r: b.right + 10, t: b.top - 10, b: b.bottom + 10 });
    }
    return zs;
  }
  function elegirDestino(m) {
    const zs = zonasTexto();
    let x, y;
    for (let i = 0; i < 16; i++) {
      x = rnd(MARGEN, W - MARGEN); y = rnd(MARGEN, H - MARGEN);
      if (!zs.some(z => x > z.l && x < z.r && y > z.t && y < z.b) && Math.hypot(x - m.x, y - m.y) > 120) break;
    }
    m.tx = x; m.ty = y;
  }

  // ---- flores ----
  function floresDisponibles(excluir) {
    const minY = fraseEl.getBoundingClientRect().bottom + 15;
    return [...ramoEl.querySelectorAll('.cabeza')].filter(f => {
      if (excluir && excluir.includes(f)) return false;
      const r = f.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      return r.width > 20 && cx > MARGEN && cx < W - MARGEN && cy > minY && cy < H - MARGEN;
    });
  }
  function puntoFlor(f) {
    const r = f.getBoundingClientRect();
    return [r.left + r.width / 2, r.top + r.height / 2 - r.height * .1];
  }

  function intentarPosar() {
    const ocupadas = ms.filter(m => m.estado === 'posada' || m.estado === 'aterriza');
    if (ocupadas.length >= 2) return;
    const libres = ms.filter(m => m.estado === 'vuelo' && !m.entrando);
    const flores = floresDisponibles(ocupadas.map(m => m.flor));
    if (!libres.length || !flores.length) return;
    const m = libres[Math.floor(Math.random() * libres.length)];
    m.flor = flores[Math.floor(Math.random() * flores.length)];
    m.estado = 'aterriza';
    setQuieta(m, false);
    m.planeando = false;
  }
  function despegar(m) {
    m.estado = 'vuelo'; m.flor = null;
    setQuieta(m, false); setVel(m, VEL_RAPIDO);
    m.vy = -25;
    m.proxPlaneo = t + rnd(8, 15);
    elegirDestino(m);
  }

  // ---- loop ----
  function frame(now) {
    raf = requestAnimationFrame(frame);
    if (last === null) last = now;
    const dt = Math.min((now - last) / 1000, .05);
    last = now;
    if (dt <= 0) return;
    t += dt;

    if (ramoDesde === null && ramoEl.classList.contains('ver')) ramoDesde = t;
    if (t >= proxPosarse) {
      if (ramoDesde !== null && t - ramoDesde > 4.2) { intentarPosar(); proxPosarse = t + rnd(6, 10); }
      else proxPosarse = t + 1;   // las flores todavía no se abrieron
    }

    for (const m of ms) {
      if (m.estado === 'espera') {
        if (t < m.inicio) continue;
        m.estado = 'vuelo';
        m.el.style.visibility = 'visible';
        elegirDestino(m);
        const d = Math.hypot(m.tx - m.x, m.ty - m.y) || 1;
        m.vx = (m.tx - m.x) / d * 35; m.vy = (m.ty - m.y) / d * 35;
      }

      let tx = m.tx, ty = m.ty;
      if (m.estado === 'aterriza' || m.estado === 'posada') {
        if (!m.flor.isConnected || m.flor.getBoundingClientRect().width < 10) { despegar(m); tx = m.tx; ty = m.ty; }
        else [tx, ty] = puntoFlor(m.flor);
      }
      let dx = tx - m.x, dy = ty - m.y, dist = Math.hypot(dx, dy) || .001;

      if (m.estado === 'vuelo') {
        if (dist < 30) { elegirDestino(m); dx = m.tx - m.x; dy = m.ty - m.y; dist = Math.hypot(dx, dy) || .001; }
        // planeo ocasional
        if (!m.planeando && t >= m.proxPlaneo) { m.planeando = true; m.finPlaneo = t + rnd(1, 2); setVel(m, VEL_PLANEO); }
        else if (m.planeando && t >= m.finPlaneo) { m.planeando = false; m.proxPlaneo = t + rnd(8, 15); setVel(m, VEL_RAPIDO); }
      }

      let wob = 1;
      if (m.estado === 'posada') {
        const k = 1 - Math.exp(-dt * 10);
        m.x += dx * k; m.y += dy * k; m.vx = m.vy = 0; wob = 0;
        if (t >= m.hasta) despegar(m);
        else if (t >= m.proxQuieta) {
          setQuieta(m, !m.quieta);
          m.proxQuieta = t + (m.quieta ? rnd(.8, 1.6) : rnd(1.2, 2.4));
        }
      } else {
        // steering suave: aceleración limitada hacia la velocidad deseada
        let vm = m.vmax * (.85 + .15 * Math.sin(t * .9 + m.ph));
        if (m.planeando) vm *= .7;
        if (m.estado === 'aterriza') {
          vm *= clamp(dist / 90, .15, 1);
          wob = clamp(dist / 80, 0, 1);
          setVel(m, dist < 90 ? VEL_PLANEO : VEL_RAPIDO);
        }
        const ax = dx / dist * vm - m.vx, ay = dy / dist * vm - m.vy;
        const am = Math.hypot(ax, ay), lim = m.vmax * 2.5 * dt;
        const f = am > lim ? lim / am : 1;
        m.vx += ax * f; m.vy += ay * f;
        m.x += m.vx * dt; m.y += m.vy * dt;

        if (m.estado === 'aterriza' && dist < 6 && Math.hypot(m.vx, m.vy) < 25) {
          m.estado = 'posada'; m.vx = m.vy = 0;
          setVel(m, VEL_POSADA);
          m.hasta = t + rnd(3, 5);
          m.proxQuieta = t + rnd(.6, 1.4);
        }
      }

      if (m.entrando && m.x > 0 && m.x < W && m.y > 0 && m.y < H) m.entrando = false;

      // bamboleo perpendicular a la dirección de vuelo
      const sp = Math.hypot(m.vx, m.vy);
      if (sp > 6) {
        const kh = Math.min(1, dt * 4);
        m.hx += (m.vx / sp - m.hx) * kh; m.hy += (m.vy / sp - m.hy) * kh;
        const n = Math.hypot(m.hx, m.hy) || 1; m.hx /= n; m.hy /= n;
      }
      const off = m.amp * Math.sin(t * m.frq + m.ph) * Math.min(1, sp / 25) * wob;
      const rx = m.x - m.hy * off, ry = m.y + m.hx * off;

      // inclinación y espejo según dirección horizontal
      const tiltObj = m.estado === 'posada' ? 0 : clamp(m.vx / 60 * 25, -25, 25);
      m.tilt += (tiltObj - m.tilt) * Math.min(1, dt * 5);
      if (m.vx > 10) m.face = 1; else if (m.vx < -10) m.face = -1;

      m.el.style.transform =
        `translate3d(${(rx - m.w / 2).toFixed(2)}px,${(ry - m.h / 2).toFixed(2)}px,0) rotate(${m.tilt.toFixed(2)}deg) scaleX(${m.face})`;
    }
  }

  // ---- movimiento reducido: quietas y posadas en lugares fijos ----
  function colocarQuietas() {
    const fl = floresDisponibles();
    const fijos = [[.16, .42], [.84, .5], [.22, .7], [.78, .34]];
    ms.forEach((m, i) => {
      let x, y;
      if (fl.length >= 4) [x, y] = puntoFlor(fl[Math.floor((i + .5) * fl.length / 4)]);
      else [x, y] = [fijos[i][0] * W, fijos[i][1] * H];
      m.el.style.visibility = 'visible';
      m.el.style.transform = `translate3d(${(x - m.w / 2).toFixed(2)}px,${(y - m.h / 2).toFixed(2)}px,0)`;
    });
    quietasListas = true;
  }

  // ---- eventos ----
  addEventListener('resize', () => {
    W = innerWidth; H = innerHeight;
    if (reducir) { if (quietasListas) colocarQuietas(); return; }
    for (const m of ms) {
      if (m.estado === 'espera' || m.entrando) continue;
      if (m.estado === 'vuelo') {
        if (m.x < 0 || m.x > W || m.y < 0 || m.y > H) { m.x = clamp(m.x, MARGEN, W - MARGEN); m.y = clamp(m.y, MARGEN, H - MARGEN); elegirDestino(m); }
        else if (m.tx > W - MARGEN || m.ty > H - MARGEN) elegirDestino(m);
      }
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
    else if (!raf && ms.length && !reducir) { last = null; raf = requestAnimationFrame(frame); }
  });

  function iniciar() {
    const cont = document.createElement('div');
    cont.id = 'mariposas';
    document.body.appendChild(cont);
    ms = PALETAS.map((_, i) => crear(i));
    if (reducir) {
      colocarQuietas();
      document.getElementById('abrir').addEventListener('click', () => setTimeout(colocarQuietas, 4200), { once: true });
      return;
    }
    proxPosarse = rnd(6, 10);
    raf = requestAnimationFrame(frame);
  }
  // desde que carga la página, en todas las pantallas
  iniciar();
})();
</script>
</body>
</html>
